[package]
name = "rexhook"
version = "0.1.0"
description = "REX Chain transfer hook — launch rules the chain itself enforces on every transfer"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rexhook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = "1.0.2"
spl-transfer-hook-interface = "2.1"
spl-tlv-account-resolution = "0.11"
